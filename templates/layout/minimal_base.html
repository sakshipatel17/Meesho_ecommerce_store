{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="https://res.cloudinary.com/rohanphulkar/image/upload/v1685433159/Kostaa/path248_tef4qs.png"
      type="image/png"
    />
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
    <title>Meesho</title>
    
    <style>
        /* Minimal Meesho Layout */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .main-container {
            display: flex;
            min-height: 100vh;
        }
        
        /* Fixed Left Logo */
        .left-sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 200px;
            height: 100vh;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }
        
        .left-sidebar .logo {
            flex-shrink: 0;
        }
        
        /* Main Content Area */
        .main-content {
            margin-left: 200px;
            flex: 1;
            background: #f8f9fa;
            min-height: 100vh;
            overflow-y: auto;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .left-sidebar {
                width: 150px;
            }
            
            .main-content {
                margin-left: 150px;
            }
        }
        
        @media (max-width: 576px) {
            .left-sidebar {
                width: 120px;
            }
            
            .main-content {
                margin-left: 120px;
            }
            
            .left-sidebar img {
                width: 80px !important;
            }
        }
        
        /* Remove footer and extra elements */
        footer {
            display: none !important;
        }
        
        .navbar, .header-nav {
            display: none !important;
        }
    </style>
  </head>
  <body>
    <div class="main-container">
        <!-- Fixed Left Logo -->
        <div class="left-sidebar">
            <div class="logo">
                <a href="{% url 'shop' %}">
                    <img src="{% static 'img/meesho-logo.svg' %}" width="120" alt="Meesho" />
                </a>
            </div>
        </div>
        
        <!-- Main Content Area -->
        <div class="main-content">
            {% block content %}{% endblock content %}
        </div>
    </div>

    <script
      defer
      type="module"
      src="https://res.cloudinary.com/rohanphulkar/raw/upload/v1673963494/synfert/preline_norz6c.js"
    ></script>

    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Swiper JS -->
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
