{% extends '../layout/base.html' %}
{% load static %}

{% block content %}

<div class="container mt-5">
    <div class="card p-4" style="max-width:500px; margin:auto; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
        <h3 class="mb-3" style="color: #282c3f; font-weight: 600;">Change Password</h3>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn w-100" style="background: #ff3e6c; color: white; border: none; padding: 12px; border-radius: 4px; font-weight: 500;">
                Update Password
            </button>
        </form>
        
        {% if form.errors %}
            <div class="alert alert-danger mt-3" style="background: #f8d7da; color: #721c24; padding: 12px; border-radius: 4px; border: 1px solid #f5c6cb;">
                {% for field, errors in form.errors.items %}
                    {% for error in errors %}
                        <p class="mb-0">{{ error }}</p>
                    {% endfor %}
                {% endfor %}
            </div>
        {% endif %}
    </div>
</div>

{% endblock %}
